server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # keep /docs -> /docs/ redirects on the original scheme+host
    # (nginx sits behind NPM/Cloudflare; absolute redirects would downgrade to http://)
    absolute_redirect off;

    # the web root is a git checkout (git-sync): don't serve the repo's own files
    location ~ /\.            { return 404; }
    location ^~ /_server/     { return 404; }
    location = /README.md     { return 404; }

    # pages and scripts: always revalidate so a sync shows up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
